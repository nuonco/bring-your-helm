<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bring Your Helm{% endblock %} | Nuon</title>
    <meta name="description" content="Convert your Helm chart into a Nuon BYOC app configuration in seconds.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nuon: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <header class="border-b border-gray-800 px-6 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="text-xl font-bold text-nuon-400">Nuon</span>
                <span class="text-gray-500">/</span>
                <span class="text-lg font-medium">Bring Your Helm</span>
            </a>
            <a href="https://nuon.co" target="_blank" rel="noopener"
               class="text-sm text-gray-500 hover:text-gray-300 transition-colors">
                nuon.co
            </a>
        </div>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-800 px-6 py-4 text-center text-sm text-gray-600">
        Powered by <a href="https://nuon.co" class="text-nuon-500 hover:text-nuon-400">Nuon</a>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
