services:
  - type: web
    name: bring-your-helm
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
